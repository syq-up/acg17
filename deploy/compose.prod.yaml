name: acg17

services:
  mysql:
    image: acg17-mysql:${IMAGE_TAG:-0.1.0}
    pull_policy: never
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: acg17
      MYSQL_USER: ${DB_USERNAME:-acg17}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - acg17-network

  backend:
    image: acg17-backend:${IMAGE_TAG:-0.1.0}
    pull_policy: never
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 18002
      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/acg17?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
      DB_USERNAME: ${DB_USERNAME:-acg17}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MAIL_HOST: ${MAIL_HOST:-smtp.qq.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME is required}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      MEDIA_URL_SECRET: ${MEDIA_URL_SECRET:?MEDIA_URL_SECRET is required}
      MEDIA_URL_EXPIRATION_MINUTES: ${MEDIA_URL_EXPIRATION_MINUTES:-60}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-10}
      LOGIN_WINDOW_MINUTES: ${LOGIN_WINDOW_MINUTES:-5}
      FILE_UPLOAD_FOLDER: /data/acg17/
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -Duser.timezone=Asia/Shanghai}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${MEDIA_DATA_DIR:-/data/acg17}:/data/acg17
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - ': >/dev/tcp/127.0.0.1/18002'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - acg17-network

  frontend:
    image: acg17-frontend:${IMAGE_TAG:-0.1.0}
    pull_policy: never
    restart: unless-stopped
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-18000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - acg17-network

volumes:
  mysql-data:

networks:
  acg17-network:
    driver: bridge
